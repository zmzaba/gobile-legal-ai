<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Gobile & Associates</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>
	
<header class="top-bar">
    <div class="brand">
        <h1>Gobile & Associates Incorporated</h1>
        <span>Internal Legal Systems</span>
    </div>
</header>

<main class="container">

    <section class="card login-card">
        <h2 class="login-title">Gobile & Associate | AI Login</h2>

        <form th:action="@{/login}" method="post">

            <label>Email Address</label>
            <input type="email" name="username" required placeholder="Please enter admin email">

            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">

            <button type="submit">Sign In</button>
        </form>

        <div class="login-footer">
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>
    </section>

</main>

<footer class="footer">
    © 2026 Gobile & Associates Incorporated | AI-assisted drafting for legal professionals
</footer>

</body>
</html>
